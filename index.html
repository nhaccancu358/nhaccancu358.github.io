<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Âm Nhạc Căn Cứ 358 - Tần Số 432Hz</title>
    <meta name="description" content="Đài phát âm thanh độc bản Căn Cứ 358 - Nơi linh hồn nhớ lại, tần số 432Hz tự do và tĩnh lặng.">
    <meta name="theme-color" content="#0a0b10">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    
    <style>
        :root {
            --bg-base: #07080c;
            --bg-surface: #0f1118;
            --bg-card: #151824;
            --bg-hover: #1c2132;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-gold: #f6d365;
            --text-main: #f0f3f8;
            --text-muted: #8b94a7;
            --border: #23293d;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-glow: 0 0 25px rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 140px;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 350px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.15) 0%, rgba(0, 242, 254, 0.05) 50%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(11, 13, 20, 0.85);
            backdrop-filter: blur(15px);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        header p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Controls / Search Bar */
        .toolbar {
            position: relative;
            z-index: 10;
            padding: 14px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.25s;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
        }

        .track-count {
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 600;
            white-space: nowrap;
            background: var(--bg-surface);
            padding: 9px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        /* Track List */
        .playlist-container {
            position: relative;
            z-index: 5;
            padding: 0 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .track-item:hover {
            background: var(--bg-hover);
            border-color: rgba(0, 242, 254, 0.3);
            transform: translateY(-1px);
        }

        .track-item.active {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.12), rgba(0, 242, 254, 0.08));
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .track-num {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .track-item.active .track-num {
            display: none;
        }

        /* Equalizer Animation for active song */
        .eq-bars {
            display: none;
            width: 24px;
            height: 18px;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .track-item.active .eq-bars {
            display: flex;
        }

        .eq-bar {
            width: 3px;
            background: var(--accent-cyan);
            border-radius: 2px;
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.5s; }
        .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.2s; }

        @keyframes bounce {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-item.active .track-title {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        .track-sub {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
        }

        .track-action {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .track-action svg {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
        }

        .track-item:hover .track-action {
            background: var(--accent-cyan);
        }

        .track-item:hover .track-action svg {
            fill: #000;
        }

        .track-item.active .track-action {
            background: var(--accent-cyan);
        }

        .track-item.active .track-action svg {
            fill: #000;
        }

        /* Fixed Bottom Player */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 16, 25, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            padding: 10px 16px 14px;
        }

        .player-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Progress Bar */
        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .time-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            width: 38px;
            text-align: center;
        }

        .progress-bar-container {
            flex: 1;
            height: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-bg {
            width: 100%;
            height: 5px;
            background: var(--bg-hover);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 4px;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Player Main Row */
        .player-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .now-playing-info {
            flex: 1;
            min-width: 0;
        }

        .now-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-artist {
            font-size: 11px;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
        }

        /* Controls */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-ctrl svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn-ctrl:hover {
            color: var(--text-main);
            background: var(--bg-hover);
        }

        .btn-ctrl.active {
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.1);
        }

        .btn-play {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #000;
            border-radius: 50%;
            box-shadow: var(--shadow-glow);
            transform: scale(1);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .btn-play svg {
            width: 20px;
            height: 20px;
            fill: #000;
        }

        .btn-play:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
            color: #000;
        }

        /* Floating Wave Canvas */
        canvas#visualizer {
            display: block;
            width: 100%;
            height: 24px;
            opacity: 0.8;
            margin-bottom: -4px;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header>
        <div class="brand-badge">⚡ CĂN CỨ 358 • TỌA ĐỘ LẶNG</div>
        <h1>Âm Nhạc Căn Cứ 358</h1>
        <p>36 Tuyệt Phẩm Âm Thanh Lượng Tử • Tần Số 432Hz Tự Do & Bất Diệt</p>
    </header>

    <div class="toolbar">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Tìm tên bài hát trong 36 bài...">
        </div>
        <div class="track-count" id="trackCountBadge">36 Bài</div>
    </div>

    <main class="playlist-container" id="playlistContainer">
        <!-- Render tracks via JS -->
    </main>

    <!-- Bottom Audio Player -->
    <div class="bottom-player">
        <div class="player-inner">
            <canvas id="visualizer"></canvas>
            
            <div class="progress-wrapper">
                <span class="time-label" id="currentTime">0:00</span>
                <div class="progress-bar-container" id="progressBar">
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <span class="time-label" id="totalDuration">0:00</span>
            </div>

            <div class="player-main-row">
                <div class="now-playing-info">
                    <div class="now-title" id="nowPlayingTitle">Chọn một bài hát để bắt đầu</div>
                    <div class="now-artist">Căn Cứ 358 • 432Hz Audio</div>
                </div>

                <div class="player-controls">
                    <button class="btn-ctrl" id="btnShuffle" title="Phát ngẫu nhiên">
                        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                    <button class="btn-ctrl" id="btnPrev" title="Bài trước">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="btn-ctrl btn-play" id="btnPlay" title="Phát/Dừng">
                        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="btn-ctrl" id="btnNext" title="Bài tiếp">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button class="btn-ctrl" id="btnRepeat" title="Lặp lại">
                        <svg id="iconRepeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = true; // Mặc định bật xáo trộn
        let repeatMode = 0; // 0 = Loop all, 1 = Repeat One

        const audio = document.getElementById('audio');
        const playlistContainer = document.getElementById('playlistContainer');
        const btnPlay = document.getElementById('btnPlay');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnShuffle = document.getElementById('btnShuffle');
        const btnRepeat = document.getElementById('btnRepeat');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalDurationEl = document.getElementById('totalDuration');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const searchInput = document.getElementById('searchInput');
        const trackCountBadge = document.getElementById('trackCountBadge');

        // Khởi tạo visualizer giả lập sóng 432Hz
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        let wavePhase = 0;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawWave() {
            requestAnimationFrame(drawWave);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!isPlaying) return;

            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.7)';
            ctx.beginPath();

            const sliceWidth = canvas.width / 50;
            let x = 0;

            for (let i = 0; i <= 50; i++) {
                const y = (canvas.height / 2) + Math.sin(i * 0.3 + wavePhase) * 6 * Math.sin(wavePhase * 0.5);
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                x += sliceWidth;
            }
            ctx.stroke();
            wavePhase += 0.08;
        }
        drawWave();

        // Load Playlist Data
        fetch('playlist.json')
            .then(res => res.json())
            .then(data => {
                playlist = data;
                renderPlaylist(playlist);
                if (playlist.length > 0) {
                    // Mặc định chọn bài ngẫu nhiên đầu tiên
                    currentIndex = Math.floor(Math.random() * playlist.length);
                    loadTrack(currentIndex, false);
                }
            })
            .catch(err => {
                console.error("Lỗi nạp danh sách nhạc:", err);
            });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderPlaylist(tracks) {
            playlistContainer.innerHTML = '';
            trackCountBadge.textContent = `${tracks.length} Bài`;

            tracks.forEach((track, idx) => {
                const originalIndex = playlist.findIndex(t => t.file === track.file);
                const item = document.createElement('div');
                item.className = `track-item ${originalIndex === currentIndex ? 'active' : ''}`;
                item.dataset.index = originalIndex;

                item.innerHTML = `
                    <div class="track-num">${(originalIndex + 1).toString().padStart(2, '0')}</div>
                    <div class="eq-bars">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-sub">
                            <span>432Hz</span>
                            <span>•</span>
                            <span>${track.size_mb} MB</span>
                        </div>
                    </div>
                    <div class="track-action">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                `;

                item.addEventListener('click', () => {
                    loadTrack(originalIndex, true);
                });

                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index, autoPlay = true) {
            currentIndex = index;
            const track = playlist[currentIndex];
            if (!track) return;

            audio.src = track.file;
            nowPlayingTitle.textContent = track.title;
            document.title = `▶ ${track.title} • Căn Cứ 358`;

            // Cập nhật UI danh sách
            document.querySelectorAll('.track-item').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.index) === currentIndex);
            });

            // MediaSession API cho điều khiển màn hình khóa điện thoại
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: 'Căn Cứ 358',
                    album: 'Tần Số 432Hz Tự Do',
                    artwork: [
                        { src: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=512', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });
            }

            if (autoPlay) {
                playAudio();
            }
        }

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            }).catch(e => console.log("Cần tương tác người dùng để phát:", e));
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            document.title = `⏸ ${playlist[currentIndex]?.title || 'Âm Nhạc 358'}`;
        }

        btnPlay.addEventListener('click', () => {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });

        function playNext() {
            if (isShuffle) {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * playlist.length);
                } while (playlist.length > 1 && nextIdx === currentIndex);
                loadTrack(nextIdx, true);
            } else {
                const nextIdx = (currentIndex + 1) % playlist.length;
                loadTrack(nextIdx, true);
            }
        }

        function playPrev() {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                const prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
                loadTrack(prevIdx, true);
            }
        }

        btnNext.addEventListener('click', playNext);
        btnPrev.addEventListener('click', playPrev);

        // Nút Shuffle
        if (isShuffle) btnShuffle.classList.add('active');
        btnShuffle.addEventListener('click', () => {
            isShuffle = !isShuffle;
            btnShuffle.classList.toggle('active', isShuffle);
        });

        // Nút Repeat
        btnRepeat.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 2;
            if (repeatMode === 1) {
                btnRepeat.classList.add('active');
                btnRepeat.title = "Đang lặp lại 1 bài";
            } else {
                btnRepeat.classList.remove('active');
                btnRepeat.title = "Lặp lại toàn bộ danh sách";
            }
        });

        // Kết thúc bài
        audio.addEventListener('ended', () => {
            if (repeatMode === 1) {
                audio.currentTime = 0;
                playAudio();
            } else {
                playNext();
            }
        });

        // Tiến trình bài hát
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalDurationEl.textContent = formatTime(audio.duration);
        });

        // Click trên thanh tua nhạc
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const clickPos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = clickPos * audio.duration;
            }
        });

        // Tìm kiếm thời gian thực
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = playlist.filter(t => t.title.toLowerCase().includes(term));
            renderPlaylist(filtered);
        });

        // Đăng ký MediaSession Action Handlers (Điều khiển từ màn hình khóa điện thoại)
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', playAudio);
            navigator.mediaSession.setActionHandler('pause', pauseAudio);
            navigator.mediaSession.setActionHandler('previoustrack', playPrev);
            navigator.mediaSession.setActionHandler('nexttrack', playNext);
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime && audio.duration) {
                    audio.currentTime = details.seekTime;
                }
            });
        }
    </script>
</body>
</html>
